name: Frontend accessibility
on:
  pull_request:
    paths: ['src/**', 'public/**', 'index.html', 'package*.json', '*config*.ts', 'tsconfig*.json', 'scripts/**', 'tests/browser/**', 'tests/baselines/**', 'tests/production/**', 'LICENSE', 'NOTICE.md', 'docs/distribution-policy.md', '.github/workflows/frontend-ui.yml']
  push:
    paths: ['src/**', 'public/**', 'index.html', 'package*.json', '*config*.ts', 'tsconfig*.json', 'scripts/**', 'tests/browser/**', 'tests/baselines/**', 'tests/production/**', 'LICENSE', 'NOTICE.md', 'docs/distribution-policy.md', '.github/workflows/frontend-ui.yml']
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: node -e "if(process.version !== 'v22.23.2') process.exit(1)" && test "$(npm --version)" = 10.9.8
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:ratchet && npm run typecheck:ui-delta && npm run test:types:ui && npm run typecheck:scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:asteroid-gpu

  production-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.8
      - run: node -e "if(process.version !== 'v22.23.2') process.exit(1)" && test "$(npm --version)" = 10.9.8
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Build the artifact with the backend disabled
        run: npm run build
        env:
          VITE_BACKEND_ORIGIN: ''
      - name: Record the tested artifact identity
        id: production-provenance
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { mkdir, readFile, readdir, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';

          const sha256 = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const git = (revision) => execFileSync('git', ['rev-parse', revision], { encoding: 'utf8' }).trim();
          const files = [];
          async function hashDirectory(relative = '') {
            for (const entry of await readdir(join('dist', relative), { withFileTypes: true })) {
              const path = relative ? `${relative}/${entry.name}` : entry.name;
              if (entry.isDirectory()) {
                await hashDirectory(path);
              } else if (entry.isFile()) {
                const bytes = await readFile(join('dist', path));
                files.push({ path, bytes: bytes.length, sha256: sha256(bytes) });
              } else {
                throw new Error(`Unsupported dist entry: ${path}`);
              }
            }
          }
          await hashDirectory();
          files.sort((left, right) => left.path < right.path ? -1 : left.path > right.path ? 1 : 0);
          if (files.length === 0) throw new Error('The compiled dist must not be empty');
          const manifest = {
            source: { sha: git('HEAD'), tree: git('HEAD^{tree}') },
            lockfile: { path: 'package-lock.json', sha256: sha256(await readFile('package-lock.json')) },
            toolchain: {
              node: process.version,
              npm: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(),
            },
            dist: { directory: 'dist', files },
          };
          await mkdir('artifacts/production', { recursive: true });
          await writeFile('artifacts/production/provenance.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - run: npm run test:production
      - name: Retain the tested artifact and acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-production-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            artifacts/production/
            playwright-report/production-4185/
            test-results/production-4185/
          retention-days: 14
          if-no-files-found: warn

  browser:
    needs: ui
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: chromium-tab-zoom
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: node -e "if(process.version !== 'v22.23.2') process.exit(1)" && test "$(npm --version)" = 10.9.8
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: frontend-browser-${{ matrix.project }}-failures
          path: |
            test-results/
            playwright-report/
