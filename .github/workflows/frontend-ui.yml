name: Frontend accessibility
on:
  pull_request:
    paths: ['src/**', 'index.html', 'package*.json', '*config*.ts', 'tsconfig*.json', 'scripts/**', 'tests/browser/**', 'tests/baselines/**', '.github/workflows/frontend-ui.yml']
  push:
    paths: ['src/**', 'index.html', 'package*.json', '*config*.ts', 'tsconfig*.json', 'scripts/**', 'tests/browser/**', 'tests/baselines/**', '.github/workflows/frontend-ui.yml']
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: node -e "if(process.version !== 'v22.23.2') process.exit(1)" && test "$(npm --version)" = 10.9.8
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - run: npm run typecheck:ratchet && npm run typecheck:ui-delta && npm run test:types:ui && npm run typecheck:scripts
      - run: npm run build
      - run: npm run verify:asteroid-gpu
      # Non-blocking until the suite passes on GPU-less runners: SwiftShader
      # lacks KHR_parallel_shader_compile, which the warmup specs require.
      - id: browser
        run: npm run test:browser
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() || steps.browser.outcome == 'failure'
        with:
          name: frontend-browser-failures
          path: |
            test-results/
            playwright-report/
