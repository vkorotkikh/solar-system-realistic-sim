name: R3 R4 scientific regression gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  r3-r4-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TZ: UTC
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the pinned Python interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: ci/r3-r4-requirements.txt

      - name: Select the pinned Node.js interpreter
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Assert the declared npm version
        run: test "$(npm --version)" = "10.9.8"

      - name: Install the isolated R3/R4 test environment
        run: python -m pip install -r ci/r3-r4-requirements.txt

      - name: Install the locked browser dependencies
        run: npm ci --ignore-scripts

      - name: Run browser unit and integration tests
        run: npm test

      - name: Build the production browser bundle
        run: npm run build

      - name: Prevent growth of the strict TypeScript backlog
        run: npm run typecheck:ratchet

      - name: Require zero strict TypeScript errors
        run: npm run typecheck

      - name: Exercise runner and workflow fail-closed contracts
        run: >-
          python -m pytest --noconftest -q
          scripts/ci/tests/test_verify_r3_r4_runner.py
          scripts/ci/tests/test_r3_r4_workflow.py

      - name: Run the exact baseline and mutation manifest
        run: |
          python scripts/ci/verify_r3_r4.py \
            --repo . \
            --manifest ci/r3-r4-science-verification.json \
            --artifacts "$RUNNER_TEMP/r3-r4-science-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            all

      - name: Retain JUnit and structured evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r3-r4-science-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r3-r4-science-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TZ: UTC
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the pinned Python interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: ci/backend-test-requirements.txt

      - name: Install the locked backend test environment
        run: python -m pip install -r ci/backend-test-requirements.txt

      - name: Run the complete backend test suite
        run: python -m pytest -q backend/tests

      - name: Run the catalog and moon-source script tests
        run: >-
          python -m pytest -q
          scripts/test_catalog_generation.py
          scripts/test_catalog_science_review.py
          scripts/test_fetch_jpl_sbdb_preflight.py
          scripts/test_moon_candidate_inputs.py
          scripts/test_moon_lazy_ephemerides.py
          scripts/test_moon_physical_radii.py
          scripts/test_moon_repairs.py
          scripts/test_wsa_observation_overlap.py

      - name: Verify the committed moon radii offline
        run: python scripts/generate_moon_physical_radii.py --check

      - name: Verify the committed asteroid Phase 1 dataset offline
        run: python scripts/build_asteroid_phase1_dataset.py --offline --check
