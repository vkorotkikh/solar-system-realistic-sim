name: R3 R4 scientific regression gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  r3-r4-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TZ: UTC
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the pinned Python interpreter
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: ci/r3-r4-requirements.txt

      - name: Select the pinned Node.js interpreter
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Assert the declared npm version
        run: test "$(npm --version)" = "10.9.8"

      - name: Install the isolated R3/R4 test environment
        run: python -m pip install -r ci/r3-r4-requirements.txt

      - name: Install the locked browser dependencies
        run: npm ci --ignore-scripts

      - name: Run browser unit and integration tests
        run: npm test

      - name: Build the production browser bundle
        run: npm run build

      - name: Prevent growth of the strict TypeScript backlog
        run: npm run typecheck:ratchet

      - name: Require zero strict TypeScript errors
        run: npm run typecheck

      - name: Exercise runner and workflow fail-closed contracts
        run: >-
          python -m pytest --noconftest -q
          scripts/ci/tests/test_verify_r3_r4_runner.py
          scripts/ci/tests/test_r3_r4_workflow.py

      - name: Run the exact baseline and mutation manifest
        run: |
          python scripts/ci/verify_r3_r4.py \
            --repo . \
            --manifest ci/r3-r4-science-verification.json \
            --artifacts "$RUNNER_TEMP/r3-r4-science-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            all

      - name: Retain JUnit and structured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-r4-science-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r3-r4-science-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TZ: UTC
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the pinned Python interpreter
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: ci/backend-test-requirements.txt

      - name: Install the locked backend test environment
        run: python -m pip install -r ci/backend-test-requirements.txt

      - name: Run the complete backend test suite
        run: python -m pytest -q backend/tests
